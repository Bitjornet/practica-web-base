<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos</title>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col p-4">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-6 rounded-lg shadow mb-6 text-center">
    <h1 class="text-3xl font-bold">MOVIKA</h1>
    <p class="text-sm mt-1">Catálogo oficial de productos</p>
  </header>

  <!-- Contenedor principal dividido en 2 columnas -->
  <main class="grow flex flex-col md:flex-row gap-6">
    
    <!-- Sección Izquierda: Filtros y Catálogo (Ocupa 3/4 partes) -->
    <div class="md:w-3/4 flex flex-col gap-4">
      
      <!-- Filtros de Categoría -->
      <div id="filtros" class="flex flex-wrap gap-2 mb-2">
        <button data-categoria="Todos" class="btn-filtro bg-blue-600 text-white px-4 py-2 rounded transition">Todos</button>
        <button data-categoria="Pulseras" class="btn-filtro bg-white text-blue-600 border border-blue-600 px-4 py-2 rounded hover:bg-blue-50 transition">Pulseras</button>
        <button data-categoria="Collares" class="btn-filtro bg-white text-blue-600 border border-blue-600 px-4 py-2 rounded hover:bg-blue-50 transition">Collares</button>
        <button data-categoria="Anillos" class="btn-filtro bg-white text-blue-600 border border-blue-600 px-4 py-2 rounded hover:bg-blue-50 transition">Anillos</button>
        <button data-categoria="Aretes" class="btn-filtro bg-white text-blue-600 border border-blue-600 px-4 py-2 rounded hover:bg-blue-50 transition">Aretes</button>
        <button data-categoria="Dijes" class="btn-filtro bg-white text-blue-600 border border-blue-600 px-4 py-2 rounded hover:bg-blue-50 transition">Dijes</button>
      </div>

      <!-- Catálogo de Productos -->
      <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
        <!-- Las tarjetas las genera JavaScript -->
      </div>
      <!-- NUEVO: Pedidos Registrados -->
      <section class="mt-10 border-t pt-6">
        <h2 class="text-2xl font-bold mb-4">Pedidos registrados</h2>
        <div id="pedidos-registrados" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Las tarjetas de pedidos se generarán aquí -->
        </div>
      </section>
    </div>

    <!-- Barra lateral: Mi Pedido -->
    <aside class="md:w-1/4 bg-white p-4 rounded-lg shadow h-fit sticky top-4">
      <h2 class="text-xl font-bold mb-4 border-b pb-2">Mi pedido</h2>
      
      <ul id="lista-pedido" class="space-y-3 mb-4 min-h-25">
        <li class="text-gray-400 text-sm">No hay productos aún.</li>
      </ul>
      
      <div class="border-t pt-4">
        <p class="text-lg font-bold mb-3">Total: $<span id="total">0.00</span></p>
        <button id="btn-vaciar" class="w-full bg-red-500 text-white py-2 rounded hover:bg-red-600 transition">
          Vaciar pedido
        </button>
      </div>
      <!-- Formulario del Cliente -->
      <form id="form-cliente" class="mt-6 border-t pt-4">
        <h3 class="font-bold mb-2">Datos del cliente</h3>
        
        <div class="mb-3">
          <label for="nombre" class="block text-sm font-semibold">Nombre:</label>
          <input type="text" id="nombre" class="w-full border border-gray-300 rounded px-2 py-1 mt-1 outline-none">
          <p id="error-nombre" class="text-sm text-red-600 hidden">El nombre no puede estar vacío.</p>
        </div>

        <div class="mb-3">
          <label for="telefono" class="block text-sm font-semibold">Teléfono:</label>
          <input type="text" id="telefono" class="w-full border border-gray-300 rounded px-2 py-1 mt-1 outline-none">
          <p id="error-telefono" class="text-sm text-red-600 hidden">Debe tener exactamente 10 dígitos.</p>
        </div>

        <div class="mb-3">
          <label for="correo" class="block text-sm font-semibold">Correo:</label>
          <input type="email" id="correo" class="w-full border border-gray-300 rounded px-2 py-1 mt-1 outline-none">
          <p id="error-correo" class="text-sm text-red-600 hidden">Debe ser un correo válido.</p>
        </div>

        <p id="error-pedido" class="text-sm text-red-600 hidden mb-2">El pedido no puede estar vacío.</p>

        <button type="submit" class="w-full bg-green-500 text-white py-2 rounded hover:bg-green-600 transition mt-2 font-bold">
          Confirmar pedido
        </button>
      </form>
    </aside>
    
  </main>

  <!-- Footer (ahora está correctamente afuera del main) -->
  <footer class="mt-8 text-center text-gray-500 text-sm py-4">
    <p>Desarrollado por Movika</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
